<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <div class="w-full max-w-5xl bg-white rounded-2xl shadow-xl overflow-hidden">
    <!-- Grid Container: Sidebar (1/3) + Content (2/3) -->
    <div class="flex flex-col md:grid md:grid-cols-3 min-h-screen md:min-h-150">
      
      <!-- Sidebar - Left 1/3 with background image -->
      <aside class="relative md:col-span-1 overflow-hidden bg-cover bg-center bg-no-repeat min-h-43"
             [style.background-image]="'url(' + (isMobile ? 'assets/images/bg-sidebar-mobile.svg' : 'assets/images/bg-sidebar-desktop.svg') + ')'">
        
        <!-- Step Indicators -->
        <nav class="relative z-10 p-6 md:p-4 md:space-y-6 flex md:flex-col justify-center gap-4 md:gap-0" aria-label="Form progress">
          <div *ngFor="let step of steps" 
               class="flex items-center gap-4 transition-all duration-300">
            <!-- Step Number Circle -->
            <div class="shrink-0 w-10 h-10 rounded-full border-2 flex items-center justify-center font-semibold transition-all duration-300"
                 [class.bg-Blue-200]="isStepActive(step.number)"
                 [class.border-Blue-200]="isStepActive(step.number)"
                 [class.text-slate-900]="isStepActive(step.number)"
                 [class.border-white]="!isStepActive(step.number)"
                 [class.text-white]="!isStepActive(step.number)">
              {{ step.number }}
            </div>
            
            <!-- Step Info -->
            <div class="hidden md:flex flex-col">
              <span class="text-xs text-slate-300 uppercase tracking-wider font-medium">
                {{ step.label }}
              </span>
              <span class="text-sm font-bold tracking-wide text-white">
                {{ step.title }}
              </span>
            </div>
          </div>
        </nav>
        <svg class="hidden md:block absolute bottom-0 left-0 w-full z-10 h-auto" fill="none" viewBox="0 0 274 568">
          <rect fill="#483EFF" rx="10"/>
            <mask id="a" x="0" y="0" maskUnits="userSpaceOnUse" style="mask-type:alpha">
          <rect width="274" height="568" fill="#fff" rx="10"/>
            </mask><g mask="url(#a)">
          <path fill="#6259FF" fill-rule="evenodd" d="M-34.692 543.101C3.247 632.538 168.767 685.017 211.96 612.52c43.194-72.497-66.099-85.653-104.735-160.569-38.635-74.916-68.657-121.674-124.482-104.607-55.824 17.068-55.375 106.32-17.436 195.757Z" clip-rule="evenodd"/>
          <path fill="#F9818E" fill-rule="evenodd" d="M233.095 601.153c60.679-28.278 92.839-143.526 41.875-171.528-50.965-28.003-57.397 47.579-108.059 75.987-50.662 28.408-82.14 50.207-69.044 88.241 13.096 38.034 74.549 35.578 135.228 7.3Z" clip-rule="evenodd"/>
          <path stroke="#fff" stroke-linecap="round" stroke-linejoin="bevel" stroke-width="5" d="m165.305 469.097 10.607-10.806M209.461 474.581l-12.506-10.503M187.56 488.991l-6.908 14.798"/>
          <path fill="#FFAF7E" d="M.305 546.891c37.003 0 67-29.997 67-67s-29.997-67-67-67-67 29.997-67 67 29.997 67 67 67Z"/>
          </g>
          <!-- ... todo el contenido del SVG igual ... -->
        </svg>
      </aside>

      <!-- Content Area - Right 2/3 -->
      <main class="md:col-span-2 p-6 md:p-8 md:pt-12 bg-white flex flex-col justify-between -mt-16 md:mt-0 relative z-20">
        <div *ngIf="isConfirmed" class="flex-1 flex items-center justify-center">
          <app-thank-you></app-thank-you>
        </div>
        <!-- Dynamic Content Area -->

        <div *ngIf="!isConfirmed" class="flex-1">
          <!-- Step 1: Personal Info -->
          <div *ngIf="currentStep === 1">
              <app-first-step></app-first-step>
          </div>

          <!-- Step 2: Select Plan -->
          <div *ngIf="currentStep === 2">
            <app-second-step></app-second-step>
          </div>

          <!-- Step 3: Add-ons -->
          <div *ngIf="currentStep === 3">
            <app-third-step></app-third-step>
          </div>

          <!-- Step 4: Summary -->
          <div *ngIf="currentStep === 4">
            <app-fourth-step></app-fourth-step>
          </div>
        </div>

        <!-- Navigation Buttons -->
        <div *ngIf="!isConfirmed" class="fixed md:relative bottom-0 left-0 right-0 md:bottom-auto bg-white p-4 md:p-0 flex justify-between items-center mt-0 md:mt-8 pt-4 md:pt-6 shadow-lg md:shadow-none">
          <button *ngIf="currentStep > 1"
                  (click)="previousStep()"
                  class="px-6 py-3 text-slate-600 hover:text-slate-900 font-medium transition-colors duration-200">
            Go Back
          </button>
          <div *ngIf="currentStep === 1"></div>
          
          <button *ngIf="currentStep < totalSteps"
                  (click)="nextStep()"
                  class="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition-all duration-200 ml-auto">
            Next Step
          </button>
          
          <button *ngIf="currentStep === totalSteps"
                  (click)="confirmForm()"
                  class="px-8 py-3 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition-all duration-200 ml-auto">
            Confirm
          </button>
        </div>
      </main>
    </div>
  </div>
</div>
