<div class="w-full">
  <!-- Header -->
  <h2 class="text-3xl font-bold text-marine-blue mb-2">Select your plan</h2>
  <p class="text-cool-gray mb-8">You have the option of monthly or yearly billing.</p>

  <!-- Plan Cards Grid -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
    
    <!-- Plan Card -->
    <div *ngFor="let plan of plans"
         (click)="selectPlan(plan.id)"
         class="border-2 rounded-lg p-4 cursor-pointer transition-all duration-200 hover:border-purplish-blue"
         [class.border-purplish-blue]="isPlanSelected(plan.id)"
         [class.bg-magnolia]="isPlanSelected(plan.id)"
         [class.border-light-gray]="!isPlanSelected(plan.id)">
      
      <!-- Plan Icon -->
      <div class="mb-10">
        <img [src]="plan.icon" [alt]="plan.name + ' icon'" class="w-10 h-10">
      </div>

      <!-- Plan Info -->
      <div class="flex flex-col">
        <h3 class="text-marine-blue font-bold text-base mb-1">{{ plan.name }}</h3>
        <p class="text-cool-gray text-sm">
          ${{ getPlanPrice(plan) }}{{ getPricePeriod() }}
        </p>
        
        <!-- Yearly Bonus Text -->
        <p *ngIf="isYearly" class="text-marine-blue text-xs mt-1">
          2 months free
        </p>
      </div>
    </div>

  </div>

  <!-- Billing Toggle -->
  <div class="flex items-center justify-center gap-6 bg-magnolia rounded-lg py-4">
    <span class="text-sm font-medium transition-colors"
          [class.text-marine-blue]="!isYearly"
          [class.text-cool-gray]="isYearly">
      Monthly
    </span>
    
    <!-- Toggle Switch -->
    <button 
      type="button"
      (click)="toggleBilling()"
      class="relative inline-flex h-6 w-12 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-purplish-blue focus:ring-offset-2"
      [class.bg-marine-blue]="true"
      role="switch"
      [attr.aria-checked]="isYearly">
      <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
            [class.translate-x-7]="isYearly"
            [class.translate-x-1]="!isYearly">
      </span>
    </button>
    
    <span class="text-sm font-medium transition-colors"
          [class.text-marine-blue]="isYearly"
          [class.text-cool-gray]="!isYearly">
      Yearly
    </span>
  </div>

</div>
